<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Marquee Example</title>
    <style>
        /* Container hides the text until it enters the view box */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            border: 2px solid #333;
            background: #f4f4f4;
            padding: 10px 0;
            box-sizing: border-box;
        }
      
        /* The moving text element */
        .marquee-content {
            display: inline-block;
            padding-left: 100%; /* Starts the text completely off-screen to the right */
            font-family: sans-serif;
            font-weight: bold;
            
            /* --- MODERN MARQUEE PROPERTIES --- */
            animation-name: marqueeScroll;
            
            /* 1. marquee-speed  */
            animation-duration: 10s; 
            
            /* 2. marquee-style */
            animation-timing-function: ease-in-out; 
            
            /* 3. marquee-play-count */
            animation-iteration-count:infinite; 
            
            /* 4. marquee-direction */
            animation-direction: normal; 
        }

        /* The Animation Style definition */
        @keyframes marqueeScroll {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d( -100%, 0, 0);
            }
        }
    </style>
</head>
<body>

    <h2>Modern CSS Marquee</h2>
    <div class="marquee-container">
        <div class="marquee-content">
           ( ͡❛ ͜ʖ ͡❛)
        </div>
    </div>

</body>
</html>
