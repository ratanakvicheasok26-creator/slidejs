<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript — Asynchronous &amp; Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#121630;
    --navy-dk:#0b0e22;
    --panel:#1b2044;
    --panel-2:#232a55;
    --yellow:#f7df1e;
    --ink:#eef0fb;
    --mute:#a6acd6;
    --line:#2c3260;
    --good:#5ee6a8;
    --warn:#ff8a65;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--navy-dk); color:var(--ink);
    font-family:'Inter',sans-serif; overflow:hidden;
  }
  .deck{ position:relative; width:100vw; height:100vh; }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding: 6vh 8vw;
    background: radial-gradient(circle at 82% 12%, #1c2352 0%, var(--navy) 45%, var(--navy-dk) 100%);
    opacity:0; visibility:hidden; transform: translateX(24px);
    transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
  }
  .slide.active{
    opacity:1; visibility:visible; transform:translateX(0);
    transition: opacity .45s ease, transform .45s ease;
    z-index:2;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.14em;
    color:var(--yellow); background:rgba(247,223,30,.1);
    border:1px solid rgba(247,223,30,.35); border-radius:999px;
    padding:6px 14px; width:fit-content; margin-bottom:22px; text-transform:uppercase;
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,3.6vw,48px); line-height:1.08; margin:0 0 14px; }
  h1 .accent{ color:var(--yellow); }
  .sub{ color:var(--mute); font-size:17px; max-width:820px; line-height:1.55; margin:0 0 8px; }
  .lede{ color:var(--mute); font-size:15px; max-width:760px; line-height:1.6; }

  .row{ display:flex; gap:28px; align-items:flex-start; margin-top:22px; }
  .col{ flex:1; min-width:0; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px 24px;
  }
  .card.dark{ background:var(--panel-2); }
  .card h3{ font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 10px; display:flex; align-items:center; gap:10px;}
  .card p{ color:var(--mute); font-size:14px; line-height:1.6; margin:0 0 8px;}
  .card ul{ margin:8px 0 0; padding-left:18px; color:var(--ink); font-size:14px; line-height:1.7; }
  .card ul li{ margin-bottom:4px; }
  .card ul li::marker{ color:var(--yellow); }

  .badge{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; flex:none;
  }
  .badge.y{ background:var(--yellow); color:var(--navy-dk); }
  .badge.g{ background:var(--good); color:var(--navy-dk); }
  .badge.w{ background:var(--warn); color:var(--navy-dk); }

  pre.code{
    font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.65;
    background:var(--navy-dk); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin:0; overflow:auto; color:#d7dbf5;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
  }
  pre.code .c1{ color:#7a81ad; }
  pre.code .kw{ color:var(--yellow); }
  pre.code .fn{ color:#8ecbff; }
  pre.code .str{ color:#5ee6a8; }
  pre.code .num{ color:#ff8a65; }

  .grid{ display:grid; gap:16px; margin-top:22px; }
  .grid.g4{ grid-template-columns:repeat(4,1fr); }
  .grid.g3{ grid-template-columns:repeat(3,1fr); }
  .grid.g2{ grid-template-columns:repeat(2,1fr); }
  .tile{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; display:flex; flex-direction:column; gap:8px;
  }
  .tile .ic{ font-size:20px; }
  .tile h4{ margin:0; font-family:'Space Grotesk',sans-serif; font-size:15.5px; }
  .tile p{ margin:0; color:var(--mute); font-size:12.5px; line-height:1.55; }
  .tile code{ font-family:'JetBrains Mono',monospace; color:var(--yellow); font-size:12px; }

  /* title slide */
  .title-slide{ justify-content:center; }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brand .mark{
    width:46px; height:46px; border-radius:12px; background:var(--yellow); color:var(--navy-dk);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;
  }
  .brand span{ font-family:'JetBrains Mono',monospace; color:var(--mute); letter-spacing:.1em; font-size:13px; }
  .title-slide h1{ font-size:clamp(38px,5.2vw,64px); }
  .title-slide .sub{ font-size:20px; color:var(--ink); }
  .footer-note{ margin-top:40px; color:var(--mute); font-size:13px; font-family:'JetBrains Mono',monospace; }

  /* divider */
  .divider .num{
    font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--panel-2);
    font-size:clamp(90px,13vw,160px); line-height:1; -webkit-text-stroke:2px var(--line); color:transparent;
    margin-bottom:-10px;
  }
  .divider h1{ font-size:clamp(36px,4.6vw,56px); }
  .divider .bar{ width:64px; height:3px; background:var(--yellow); margin:14px 0 16px; }

  /* progress + nav */
  .chrome{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 8vw 3.4vh; z-index:5; pointer-events:none; }
  .chrome *{ pointer-events:auto; }
  .track{ flex:1; height:3px; background:var(--line); border-radius:3px; margin:0 24px; overflow:hidden; }
  .fill{ height:100%; background:var(--yellow); width:0%; transition:width .35s ease; }
  .navbtn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .navbtn:hover{ background:var(--panel-2); border-color:var(--yellow); color:var(--yellow); }
  .counter{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--mute); white-space:nowrap; }
  .navcluster{ display:flex; align-items:center; gap:10px; }

  .kicker-tag{ position:fixed; top:3.4vh; left:8vw; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mute); z-index:5; letter-spacing:.08em;}
  .kicker-tag b{ color:var(--yellow); }

  ::-webkit-scrollbar{ width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px;}
</style>
</head>
<body>

<div class="kicker-tag">JAVASCRIPT · <b>ASYNC &amp; EVENTS</b></div>
<div class="deck" id="deck"></div>

<div class="chrome">
  <div class="navcluster">
    <button class="navbtn" id="prevBtn">‹</button>
    <button class="navbtn" id="nextBtn">›</button>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="counter" id="counter">01 / 25</div>
</div>

<script>
// ---------- Slide data ----------
const slides = [];

slides.push({type:'title'});

slides.push({type:'agenda'});

slides.push({type:'divider', num:'01', title:'Asynchronous JavaScript',
  sub:'How JS runs time-consuming work without freezing the page.'});

slides.push({type:'concept', eyebrow:'Part 1 · Foundations', title:'Synchronous vs. Asynchronous',
  sub:'JavaScript is single-threaded — one call stack, one line at a time.',
  left:{h:'Synchronous', badge:'w', text:'Each line waits for the previous one to finish. A slow task (network, timer, file I/O) blocks everything else — no clicks, no rendering.',
    code:`<span class="fn">console</span>.log(<span class="str">'Start'</span>);
blockFor5Seconds(); <span class="c1">// UI frozen</span>
<span class="fn">console</span>.log(<span class="str">'End'</span>);`},
  right:{h:'Asynchronous', badge:'g', text:'Slow work is handed off (to the browser / Node APIs). JS keeps running other code, then reacts later via a callback, promise, or await.',
    code:`<span class="fn">console</span>.log(<span class="str">'Start'</span>);
<span class="fn">setTimeout</span>(() => {
  <span class="fn">console</span>.log(<span class="str">'Done'</span>);
}, <span class="num">5000</span>);
<span class="fn">console</span>.log(<span class="str">'End'</span>); <span class="c1">// runs first</span>`}});

slides.push({type:'concept', eyebrow:'Callbacks', title:'Callback Functions',
  sub:'A function passed as an argument, to be run later — after some task finishes.',
  left:{h:'How it works', badge:'y', text:'Functions are values in JS, so they can be passed into other functions and invoked once the async operation completes.',
    list:['Runs after the outer function finishes its job','Common in timers, events, and older Node APIs (fs, http)','Basis for every other async pattern that followed']},
  rightCode:{h:'Example', code:`<span class="kw">function</span> <span class="fn">greet</span>(name, callback) {
  <span class="fn">setTimeout</span>(() => {
    callback(<span class="str">\`Hello, \${name}!\`</span>);
  }, <span class="num">1000</span>);
}

<span class="fn">greet</span>(<span class="str">'Spy'</span>, (msg) => {
  <span class="fn">console</span>.log(msg); <span class="c1">// after 1s</span>
});`}});

slides.push({type:'concept', eyebrow:'The problem with callbacks', title:'Callback Hell',
  sub:'Nesting callback inside callback inside callback — code grows sideways, not down.',
  left:{h:'Why it hurts', badge:'w', text:'Each async step nests one level deeper, making code hard to read, debug, and maintain — nicknamed the "pyramid of doom".',
    list:['Deep indentation, hard to follow control flow','Error handling repeated at every level','Fixed later by Promises and async/await']},
  rightCode:{h:'Pyramid of doom', code:`getUser(id, (user) => {
  getPosts(user, (posts) => {
    getComments(posts, (c) => {
      render(c); <span class="c1">// 4 levels deep...</span>
    });
  });
});`}});

slides.push({type:'concept', eyebrow:'A cleaner pattern', title:'Promises',
  sub:'An object representing the eventual result (or failure) of an async operation.',
  left:{h:'Three states', badge:'y', text:null,
    list:['<b>Pending</b> — operation not finished yet','<b>Fulfilled</b> — completed successfully → .then()','<b>Rejected</b> — failed → .catch()']},
  rightCode:{h:'Example', code:`<span class="kw">const</span> p = <span class="kw">new</span> <span class="fn">Promise</span>((resolve, reject) => {
  <span class="fn">setTimeout</span>(() => resolve(<span class="str">'Data ready'</span>), <span class="num">1000</span>);
});

p.then(result => <span class="fn">console</span>.log(result))
 .catch(err => <span class="fn">console</span>.error(err));`}});

slides.push({type:'concept', eyebrow:'Composing promises', title:'Promise Chaining',
  sub:'Each .then() returns a new promise — so async steps can be linked in sequence, flat instead of nested.',
  left:{h:'Why it helps', badge:'g', text:'Replaces callback hell with a readable, linear flow. One .catch() at the end can handle errors from any step in the chain.',
    list:['Return a value or promise from .then() to pass it forward','.catch() catches errors from any earlier step','.finally() runs regardless of outcome']},
  rightCode:{h:'Example', code:`fetchUser(id)
  .then(user => fetchPosts(user))
  .then(posts => fetchComments(posts))
  .then(comments => render(comments))
  .catch(err => <span class="fn">console</span>.error(err))
  .finally(() => hideSpinner());`}});

slides.push({type:'concept', eyebrow:'Syntactic sugar over promises', title:'Async / Await',
  sub:'Write asynchronous code that reads like synchronous code — built on top of Promises.',
  left:{h:'Key rules', badge:'y', text:null,
    list:['<code>async</code> function always returns a Promise','<code>await</code> pauses execution until the Promise settles','Wrap in <code>try / catch</code> to handle rejections']},
  rightCode:{h:'Example', code:`<span class="kw">async function</span> <span class="fn">loadData</span>() {
  <span class="kw">try</span> {
    <span class="kw">const</span> user = <span class="kw">await</span> fetchUser(id);
    <span class="kw">const</span> posts = <span class="kw">await</span> fetchPosts(user);
    render(posts);
  } <span class="kw">catch</span> (err) {
    <span class="fn">console</span>.error(err);
  }
}`}});

slides.push({type:'concept', eyebrow:'Under the hood', title:'Microtasks &amp; the Event Loop',
  sub:'How JS decides what runs next once the call stack is empty.',
  left:{h:'Two queues', badge:'w', text:null,
    list:['<b>Call stack</b> — runs synchronous code first, always','<b>Microtask queue</b> — Promise callbacks, queueMicrotask','<b>Macrotask (task) queue</b> — setTimeout, setInterval, I/O','Event loop drains <i>all</i> microtasks before the next macrotask']},
  rightCode:{h:'Order matters', code:`<span class="fn">console</span>.log(<span class="str">'1'</span>);
<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.log(<span class="str">'2 (macro)'</span>), <span class="num">0</span>);
<span class="fn">Promise</span>.resolve().then(() => <span class="fn">console</span>.log(<span class="str">'3 (micro)'</span>));
<span class="fn">console</span>.log(<span class="str">'4'</span>);

<span class="c1">// Output: 1, 4, 3 (micro), 2 (macro)</span>`}});

slides.push({type:'concept', eyebrow:'Converting old patterns', title:'Promisification',
  sub:'Wrapping a callback-based function so it returns a Promise instead — enabling .then() / await.',
  left:{h:'Why do it', badge:'g', text:'Many older APIs (Node\'s fs, timers, callback-style libraries) predate Promises. Promisifying lets them plug into modern async/await code.',
    list:['Wrap the function; resolve() on success, reject() on error','Node offers util.promisify() as a built-in helper','Keeps async style consistent across a codebase']},
  rightCode:{h:'Manual example', code:`<span class="kw">function</span> <span class="fn">promisify</span>(fn) {
  <span class="kw">return</span> (...args) =>
    <span class="kw">new</span> <span class="fn">Promise</span>((resolve, reject) => {
      fn(...args, (err, data) =>
        err ? reject(err) : resolve(data));
    });
}

<span class="kw">const</span> readFileAsync = <span class="fn">promisify</span>(readFile);`}});

slides.push({type:'concept', eyebrow:'Scheduling work', title:'Timing Events',
  sub:'Browser APIs that run code after a delay, or repeatedly, without blocking the thread.',
  left:{h:'setTimeout()', badge:'y', text:'Runs a function once, after a minimum delay (in milliseconds).',
    code:`<span class="kw">const</span> id = <span class="fn">setTimeout</span>(() => {
  <span class="fn">console</span>.log(<span class="str">'Runs once'</span>);
}, <span class="num">2000</span>);

<span class="fn">clearTimeout</span>(id); <span class="c1">// cancel it</span>`},
  right:{h:'setInterval()', badge:'g', text:'Repeats a function every N milliseconds, until stopped.',
    code:`<span class="kw">const</span> id = <span class="fn">setInterval</span>(() => {
  <span class="fn">console</span>.log(<span class="str">'Tick'</span>);
}, <span class="num">1000</span>);

<span class="fn">clearInterval</span>(id); <span class="c1">// stop it</span>`}});

slides.push({type:'divider', num:'02', title:'JavaScript Events',
  sub:'How pages listen and react to what the user (and browser) does.'});

slides.push({type:'concept', eyebrow:'Part 2 · Foundations', title:'Events &amp; the DOM',
  sub:'An event is a signal that something happened — a click, a keystroke, a page load, a form submit.',
  left:{h:'The idea', badge:'y', text:null,
    list:['The browser fires events on DOM nodes as things happen','Code "listens" for an event, then reacts when it fires','Decouples "what happens" from "what to do about it"']},
  rightCode:{h:'DOM Events — sources', code:`<span class="c1">// Almost anything can emit events:</span>
document, window, <span class="fn">&lt;button&gt;</span>,
<span class="fn">&lt;form&gt;</span>, <span class="fn">&lt;input&gt;</span>, <span class="fn">&lt;img&gt;</span> ...

<span class="c1">// e.g. a button click, a page load,</span>
<span class="c1">// an image finishing download</span>`}});

slides.push({type:'concept', eyebrow:'Listening for events', title:'addEventListener()',
  sub:'The standard way to attach an event handler to an element.',
  left:{h:'Why prefer it', badge:'g', text:null,
    list:['Multiple listeners can be attached to one element','Doesn\'t overwrite existing on-click style handlers','Supports options: once, capture, passive','Removed later with removeEventListener()']},
  rightCode:{h:'Example', code:`<span class="kw">const</span> btn = document.querySelector(<span class="str">'#save'</span>);

btn.addEventListener(<span class="str">'click'</span>, (e) => {
  <span class="fn">console</span>.log(<span class="str">'Clicked!'</span>, e.target);
}, { once: <span class="kw">true</span> });`}});

slides.push({type:'grid', eyebrow:'Categories', title:'Common Event Types',
  sub:'Different interactions fire different named events on the target element.',
  tiles:[
    {ic:'🖱️', h:'Mouse Events', p:'click, dblclick, mousedown, mouseup, mousemove, mouseenter/leave', c:'e.clientX / e.clientY'},
    {ic:'⌨️', h:'Keyboard Events', p:'keydown, keyup, keypress — track key presses and shortcuts', c:'e.key / e.code'},
    {ic:'📝', h:'Form Events', p:'submit, change, input, focus, blur — validate and react to input', c:'e.preventDefault()'},
    {ic:'🪟', h:'Window / Document Events', p:'load, resize, scroll, DOMContentLoaded, beforeunload', c:'window.onresize'}
  ]});

slides.push({type:'concept', eyebrow:'Mouse Events', title:'Mouse Events',
  sub:'Fired as the user moves, clicks, or hovers with a pointing device.',
  left:{h:'Common types', badge:'y', text:null,
    list:['<code>click</code> / <code>dblclick</code> — single &amp; double click','<code>mousedown</code> / <code>mouseup</code> — button press &amp; release','<code>mousemove</code> — cursor movement','<code>mouseenter</code> / <code>mouseleave</code> — hover in/out']},
  rightCode:{h:'Example', code:`box.addEventListener(<span class="str">'mousemove'</span>, (e) => {
  <span class="fn">console</span>.log(e.clientX, e.clientY);
});

box.addEventListener(<span class="str">'click'</span>, (e) => {
  box.style.background = <span class="str">'gold'</span>;
});`}});

slides.push({type:'concept', eyebrow:'Keyboard Events', title:'Keyboard Events',
  sub:'Fired when the user interacts with the keyboard while an element has focus.',
  left:{h:'Common types', badge:'y', text:null,
    list:['<code>keydown</code> — key pressed down (repeats while held)','<code>keyup</code> — key released','<code>e.key</code> — the character or key name','Useful for shortcuts, games, live validation']},
  rightCode:{h:'Example', code:`document.addEventListener(<span class="str">'keydown'</span>, (e) => {
  <span class="kw">if</span> (e.key === <span class="str">'Enter'</span>) {
    submitForm();
  }
});`}});

slides.push({type:'concept', eyebrow:'Form Events', title:'Form Events',
  sub:'Fired as users fill out and submit forms — the backbone of client-side validation.',
  left:{h:'Common types', badge:'y', text:null,
    list:['<code>submit</code> — form submitted (form element)','<code>change</code> — value committed (on blur / select)','<code>input</code> — fires on every keystroke','<code>focus</code> / <code>blur</code> — field gains / loses focus']},
  rightCode:{h:'Example', code:`form.addEventListener(<span class="str">'submit'</span>, (e) => {
  e.preventDefault(); <span class="c1">// stop page reload</span>
  <span class="kw">if</span> (!email.value.includes(<span class="str">'@'</span>)) {
    <span class="fn">alert</span>(<span class="str">'Invalid email'</span>);
  }
});`}});

slides.push({type:'concept', eyebrow:'Page-level events', title:'Window / Document Events',
  sub:'Fired by the browser itself, about the page as a whole rather than one element.',
  left:{h:'Common types', badge:'y', text:null,
    list:['<code>DOMContentLoaded</code> — HTML parsed, DOM ready','<code>load</code> — page + all assets fully loaded','<code>resize</code> — browser window size changes','<code>scroll</code> — user scrolls the page']},
  rightCode:{h:'Example', code:`document.addEventListener(<span class="str">'DOMContentLoaded'</span>, () => {
  <span class="fn">console</span>.log(<span class="str">'DOM ready'</span>);
});

window.addEventListener(<span class="str">'resize'</span>, () => {
  <span class="fn">console</span>.log(innerWidth, innerHeight);
});`}});

slides.push({type:'concept', eyebrow:'Event propagation', title:'Event Bubbling &amp; Capturing',
  sub:'When an event fires on a nested element, it travels through the DOM tree in two phases.',
  left:{h:'Capturing → Bubbling', badge:'w', text:'Capturing: the event travels from window down to the target. Bubbling: it then travels back up from the target to window — the default phase.',
    list:['Default: listeners fire during bubbling (target → ancestors)','Pass <code>{capture: true}</code> to listen during the capture phase','<code>e.stopPropagation()</code> halts further travel']},
  rightCode:{h:'Example', code:`outer.addEventListener(<span class="str">'click'</span>, () =>
  <span class="fn">console</span>.log(<span class="str">'outer (bubble)'</span>));

inner.addEventListener(<span class="str">'click'</span>, () =>
  <span class="fn">console</span>.log(<span class="str">'inner (target)'</span>));

<span class="c1">// click inner → "inner", then "outer"</span>`}});

slides.push({type:'concept', eyebrow:'A practical technique', title:'Event Delegation',
  sub:'Attach one listener to a parent, and let bubbling handle events from its children.',
  left:{h:'Why use it', badge:'g', text:'Instead of adding a listener to every item (expensive, and misses items added later), listen once on the container and inspect e.target.',
    list:['Fewer listeners → better performance on large lists','Automatically works for elements added dynamically','Core pattern behind many UI libraries']},
  rightCode:{h:'Example', code:`list.addEventListener(<span class="str">'click'</span>, (e) => {
  <span class="kw">if</span> (e.target.matches(<span class="str">'li'</span>)) {
    <span class="fn">console</span>.log(<span class="str">'Item:'</span>, e.target.textContent);
  }
});
<span class="c1">// works even for &lt;li&gt; added later</span>`}});

slides.push({type:'concept', eyebrow:'Beyond built-in events', title:'Custom Events',
  sub:'Define and dispatch your own named events to signal things specific to your app.',
  left:{h:'Why use them', badge:'y', text:'Lets independent parts of an app communicate without tightly coupling them together — a mini publish/subscribe pattern built into the DOM.',
    list:['Created with the CustomEvent constructor','Can carry data via the detail property','Dispatched and listened for like any native event']},
  rightCode:{h:'Example', code:`<span class="kw">const</span> ev = <span class="kw">new</span> <span class="fn">CustomEvent</span>(<span class="str">'cartUpdated'</span>, {
  detail: { items: <span class="num">3</span> }
});

document.addEventListener(<span class="str">'cartUpdated'</span>, (e) => {
  <span class="fn">console</span>.log(e.detail.items);
});

document.dispatchEvent(ev);`}});

slides.push({type:'summary'});

// ---------- Renderer ----------
const deck = document.getElementById('deck');

function esc(s){ return s; }

function renderList(items){
  return `<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
}

function renderConcept(s){
  let leftHtml = '';
  if(s.left){
    leftHtml = `<div class="card">
      <h3><span class="badge ${s.left.badge}">●</span>${s.left.h}</h3>
      ${s.left.text ? `<p>${s.left.text}</p>` : ''}
      ${s.left.list ? renderList(s.left.list) : ''}
      ${s.left.code ? `<pre class="code">${s.left.code}</pre>` : ''}
    </div>`;
  }
  let rightHtml = '';
  if(s.right){
    rightHtml = `<div class="card dark">
      <h3><span class="badge ${s.right.badge}">●</span>${s.right.h}</h3>
      ${s.right.text ? `<p>${s.right.text}</p>` : ''}
      ${s.right.list ? renderList(s.right.list) : ''}
      ${s.right.code ? `<pre class="code">${s.right.code}</pre>` : ''}
    </div>`;
  }
  if(s.rightCode){
    rightHtml = `<div class="card dark">
      <h3>${s.rightCode.h}</h3>
      <pre class="code">${s.rightCode.code}</pre>
    </div>`;
  }
  return `
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    <div class="row">
      <div class="col">${leftHtml}</div>
      <div class="col">${rightHtml}</div>
    </div>
  `;
}

function renderGrid(s){
  return `
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    <div class="grid g4">
      ${s.tiles.map(t=>`
        <div class="tile">
          <div class="ic">${t.ic}</div>
          <h4>${t.h}</h4>
          <p>${t.p}</p>
          <code>${t.c}</code>
        </div>`).join('')}
    </div>
  `;
}

function renderDivider(s){
  return `
    <div class="divider">
      <div class="num">${s.num}</div>
      <h1>${s.title}</h1>
      <div class="bar"></div>
      <p class="sub">${s.sub}</p>
    </div>
  `;
}

function renderTitle(){
  return `
    <div class="title-slide">
      <div class="brand"><div class="mark">{ }</div><span>KIRIROM INSTITUTE OF TECHNOLOGY</span></div>
      <h1>JavaScript<br><span class="accent">Asynchronous Programming</span> &amp; Events</h1>
      <p class="sub">Callbacks · Promises · Async/Await · Microtasks · Timing · DOM Events</p>
      <div class="footer-note">Prepared by Spy — Kirirom Institute of Technology (KiTH)</div>
    </div>
  `;
}

function renderAgenda(){
  return `
    <div class="eyebrow">Overview</div>
    <h1>What We'll Cover</h1>
    <div class="row">
      <div class="col card">
        <h3><span class="badge y">01</span>Asynchronous JS</h3>
        ${renderList(['Sync vs. async','Callback Functions','Callback Hell','Promises &amp; Chaining','Async / Await','Microtasks &amp; Event Loop','Promisification','setTimeout() / setInterval()'])}
      </div>
      <div class="col card dark">
        <h3><span class="badge g">02</span>JavaScript Events</h3>
        ${renderList(['Events &amp; the DOM','addEventListener()','Mouse / Keyboard / Form Events','Window / Document Events','Bubbling &amp; Capturing','Event Delegation','Custom Events'])}
      </div>
    </div>
  `;
}

function renderSummary(){
  return `
    <div class="divider">
      <div class="eyebrow">Recap</div>
      <h1>Two Ideas, One Thread</h1>
      <div class="bar"></div>
      <p class="sub" style="max-width:760px;">Asynchronous JS lets slow work happen without blocking the page; Events let that same single thread react to the outside world — the user, the DOM, the browser — as things happen.</p>
      <p class="footer-note" style="margin-top:26px;">Thank you — Questions?</p>
    </div>
  `;
}

slides.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' active':'');
  if(s.type==='title') el.innerHTML = renderTitle();
  else if(s.type==='agenda') el.innerHTML = renderAgenda();
  else if(s.type==='divider') el.innerHTML = renderDivider(s);
  else if(s.type==='concept') el.innerHTML = renderConcept(s);
  else if(s.type==='grid') el.innerHTML = renderGrid(s);
  else if(s.type==='summary') el.innerHTML = renderSummary();
  deck.appendChild(el);
});

// ---------- Navigation ----------
let current = 0;
const total = slides.length;
const els = document.querySelectorAll('.slide');
const fill = document.getElementById('fill');
const counter = document.getElementById('counter');

function pad(n){ return n<10 ? '0'+n : ''+n; }

function go(idx){
  if(idx<0 || idx>=total) return;
  els[current].classList.remove('active');
  current = idx;
  els[current].classList.add('active');
  fill.style.width = (((current+1)/total)*100)+'%';
  counter.textContent = pad(current+1)+' / '+pad(total);
}

document.getElementById('nextBtn').addEventListener('click', ()=>go(current+1));
document.getElementById('prevBtn').addEventListener('click', ()=>go(current-1));
window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)) go(current+1);
  if(['ArrowLeft','PageUp'].includes(e.key)) go(current-1);
});

go(0);
</script>
</body>
</html>
