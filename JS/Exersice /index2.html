<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caculation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-12">

            <div class="card mt-5">
                <div class="card-body">

                    <h5 class="card-title">គណនាថ្លៃផ្ញើយាន្ត</h5>

                    
                    <div class="mt-3">
                        <label class="form-label">ម៉ោងចូល​ </label>
                        <input type="time" id="time_in" class="form-control" >
                    </div>


                    <div class="mt-3">
                        <label class="form-label">ម៉ោងចេញ</label>
                        <input type="time" id="time_out" class="form-control" >
                    </div>


                    <div class="mt-3">
                        <label class="form-label">ចំណាយជាដុល្លា</label>
                        <input type="text" id="result_dolla" class="form-control" readonly>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">ចំណាយជារៀល</label>
                        <input type="text" id="result_rial" class="form-control" readonly>
                    </div>
                    <div class="mt-3 text-center">
                        <button class="btn bg-primary" onclick="calculation()">គណនាចំណាយ</button>

                    </div>

                   


                </div>
            </div>

        </div>
    </div>
</div> 

<script>

function timeHourToMinute(timeString){
    const[hours, minutes] = timeString.split(':');

    return parseInt(hours, 10) * 60 + parseInt(minutes, 10);

    
}


function calculation(operator){

        let time_in= document.getElementById("time_in").value;
        let time_out = document.getElementById("time_out").value;
            time_in = (time_in);
            time_out= (time_out);
        let result_dolla = document.getElementById("result_dolla");
        let result_rial = document.getElementById("result_rial");

        time_in = timeHourToMinute(time_in);
        time_out = timeHourToMinute(time_out);

        let total_Minute;
        let dollar;
        let rial;



        if (time_out < time_in){
           total_Minute = time_in - time_out;
        }
        else{
            total_Minute  = time_out - time_in;
        }

        

        let total_Hours = Math.floor(total_Minute / 60)



        if(total_Hours > 8){

            dollar = (total_Hours * 0.2);
            result_dolla.value = dollar + "$";

            rial = total_Hours * 1000;
            result_rial.value = rial +  "៛";


        }
        else{
            dollar = (total_Hours * 0.125);
            result_dolla.value = dollar + "$";

            rial = total_Hours * 500;
            result_rial.value = rial +  "៛";
        }

        

        
        }

    </script>





        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
