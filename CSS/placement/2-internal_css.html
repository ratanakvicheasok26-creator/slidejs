    <style>
        table{
            margin-bottom: 20px;

            font-weight: bold;

</head>
<body>

        <tr>
            <th>No</th>
            <th>Student name</th>
            <th>Math</th>

            <th>Total</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Sok</td>
            <td>10</td>

            <td>20</td>
        </tr>
    </table>

</body>
</html>
